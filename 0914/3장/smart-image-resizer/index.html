<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Image Resizer — 나나컴퍼니</title>
  <link rel="stylesheet" href="./style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>

  <!-- ===== 헤더 ===== -->
  <header class="header">
    <a class="logo-link" href="https://nanalab.kr" target="_blank" rel="noopener" aria-label="나나컴퍼니 홈페이지로 이동">
      <img src="./logo.png" alt="나나컴퍼니 로고" class="logo-img" id="logoImg">
      <span class="logo-fallback" id="logoFallback" hidden>🐕 나나컴퍼니</span>
    </a>
    <h1 class="site-title">Smart <span class="accent">Image</span> Resizer</h1>
  </header>

  <main class="main">

    <!-- ===== 업로드 영역 ===== -->
    <section class="dropzone" id="dropzone">
      <div class="dropzone-inner">
        <div class="drop-icon" aria-hidden="true">🖼️</div>
        <h2 class="drop-title">Upload or Drop your images!</h2>
        <p class="drop-sub">JPG · PNG · WEBP 이미지를 여러 장 올릴 수 있어요</p>
        <button class="btn-upload" id="btnUpload" type="button">📂 이미지 선택</button>
        <input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp,image/gif,image/bmp" multiple hidden>
      </div>
    </section>

    <!-- ===== 옵션 패널 ===== -->
    <section class="options" id="options" hidden>
      <h3 class="options-title">⚙️ 변환 옵션</h3>

      <!-- 비율 선택 -->
      <div class="opt-group">
        <span class="opt-label">캔버스 비율</span>
        <div class="ratio-grid" id="ratioGrid">
          <button class="ratio-btn active" data-ratio="1:1" type="button"><span class="ratio-box r11"></span>1:1</button>
          <button class="ratio-btn" data-ratio="3:4" type="button"><span class="ratio-box r34"></span>3:4</button>
          <button class="ratio-btn" data-ratio="4:3" type="button"><span class="ratio-box r43"></span>4:3</button>
          <button class="ratio-btn" data-ratio="9:16" type="button"><span class="ratio-box r916"></span>9:16</button>
          <button class="ratio-btn" data-ratio="16:9" type="button"><span class="ratio-box r169"></span>16:9</button>
          <button class="ratio-btn" data-ratio="custom" type="button" id="customBtn">✏️ 커스텀</button>
        </div>
        <div class="custom-inputs" id="customInputs" hidden>
          <input type="number" id="customW" min="1" max="9999" value="2" aria-label="가로 비율"> :
          <input type="number" id="customH" min="1" max="9999" value="3" aria-label="세로 비율">
        </div>
      </div>

      <!-- 모드 선택 -->
      <div class="opt-group">
        <span class="opt-label">변환 방식</span>
        <div class="mode-row">
          <button class="mode-btn active" data-mode="padding" id="modePadding" type="button">
            <span class="mode-icon">🖼️</span>
            <span class="mode-name">Padding</span>
            <span class="mode-desc">여백을 채워 사진 전체 보존</span>
          </button>
          <button class="mode-btn" data-mode="crop" id="modeCrop" type="button">
            <span class="mode-icon">✂️</span>
            <span class="mode-name">Crop</span>
            <span class="mode-desc">가운데 기준으로 잘라 꽉 채움</span>
          </button>
        </div>
      </div>

      <!-- 여백 색상 (padding 모드일 때만) -->
      <div class="opt-group" id="padColorGroup">
        <span class="opt-label">여백 색상</span>
        <div class="color-row">
          <input type="color" id="padColor" value="#ffffff" aria-label="여백 색상 선택">
          <div class="color-presets">
            <button class="color-chip" style="background:#ffffff" data-color="#ffffff" type="button" aria-label="흰색"></button>
            <button class="color-chip" style="background:#000000" data-color="#000000" type="button" aria-label="검정"></button>
            <button class="color-chip" style="background:#F5B968" data-color="#F5B968" type="button" aria-label="크림 오렌지"></button>
            <button class="color-chip" style="background:#46232B" data-color="#46232B" type="button" aria-label="다크 브라운"></button>
          </div>
          <span class="color-value" id="colorValue">#FFFFFF</span>
        </div>
      </div>

      <button class="btn-convert" id="btnConvert" type="button">🚀 변환 시작</button>
    </section>

    <!-- ===== 파일 목록 ===== -->
    <section class="file-section" id="fileSection" hidden>
      <div class="file-section-head">
        <h3 class="file-section-title">📋 이미지 목록 <span class="file-count" id="fileCount"></span></h3>
        <button class="btn-zip" id="btnZip" type="button" disabled>📦 일괄 다운로드 (zip)</button>
      </div>
      <ul class="file-list" id="fileList"></ul>
    </section>

  </main>

  <footer class="footer">
    <p>🔒 모든 이미지는 <strong>브라우저 안에서만</strong> 처리됩니다. 서버로 전송되지 않아요.</p>
    <p class="footer-brand">© 나나컴퍼니 · Smart Image Resizer</p>
  </footer>

  <div class="toast" id="toast" role="alert" hidden></div>

  <script src="./app.js"></script>
</body>
</html>
