<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Doc Compressor — 나나컴퍼니</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>

  <!-- ===== 헤더 ===== -->
  <header class="header">
    <a class="logo-link" href="https://nanalab.kr" target="_blank" rel="noopener" title="나나컴퍼니">
      <img src="./logo.png" alt="나나컴퍼니" class="logo-img" id="logoImg" />
      <span class="logo-fallback" id="logoFallback" hidden>🐕 나나컴퍼니</span>
    </a>
    <h1 class="site-title">Smart <span>Doc</span> Compressor</h1>
  </header>

  <!-- ===== 메인 ===== -->
  <main class="main">

    <!-- 업로드 영역 -->
    <section class="dropzone" id="dropzone">
      <div class="dropzone-inner">
        <div class="drop-icon">
          <svg viewBox="0 0 24 24" width="52" height="52" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="17 8 12 3 7 8"/>
            <line x1="12" y1="3" x2="12" y2="15"/>
          </svg>
        </div>
        <h2 class="drop-title">Upload or Drop your file!</h2>
        <p class="drop-sub">파일을 이곳에 끌어다 놓거나, 버튼을 눌러 선택하세요</p>

        <button class="upload-btn" id="uploadBtn" type="button">
          📂 파일 선택하기
        </button>
        <input type="file" id="fileInput" multiple
               accept=".pptx,.docx,.pdf,.jpg,.jpeg,.png,.webp,.bmp,.gif" hidden />

        <!-- 지원 형식 아이콘 -->
        <div class="formats">
          <div class="format-chip fmt-ppt"><span class="fmt-badge">P</span> PPTX</div>
          <div class="format-chip fmt-doc"><span class="fmt-badge">W</span> DOCX</div>
          <div class="format-chip fmt-pdf"><span class="fmt-badge">≡</span> PDF</div>
          <div class="format-chip fmt-img"><span class="fmt-badge">🖼</span> 이미지</div>
        </div>
        <p class="formats-note">그 외 형식은 업로드할 수 없어요 · HWP는 PDF/Word로 변환 후 이용해주세요</p>
      </div>
    </section>

    <!-- 알림 토스트 -->
    <div class="toast" id="toast" hidden></div>

    <!-- 파일 목록 -->
    <section class="file-list" id="fileList"></section>
  </main>

  <footer class="footer">
    🔒 모든 파일은 <strong>브라우저 안에서만</strong> 처리되며, 서버로 전송되지 않습니다.
    <span class="footer-dot">·</span> © 나나컴퍼니
  </footer>

  <!-- 라이브러리 (HTTPS CDN) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="./app.js"></script>
</body>
</html>
