<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1024" />
  <title>🎯 이름 뽑기 대포</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- ① 설정 화면 -->
  <section id="setupScreen" class="screen active">
    <div class="setup-inner">
      <h1 class="logo">🎯 이름 뽑기 대포</h1>
      <p class="tagline">대포가 구슬을 발사! 🏆 <b>가장 마지막에 떨어지는 구슬</b>이 당첨</p>

      <label class="field-label" for="nameInput">참가자 이름 (한 줄에 한 명, 쉼표도 가능)</label>
      <textarea id="nameInput" rows="8" placeholder="철수&#10;영희&#10;민준&#10;서연 ..." autocomplete="off"></textarea>

      <div class="setup-row">
        <span class="count-chip"><b id="nameCount">0</b>명</span>
        <button type="button" class="mini-btn" id="sampleBtn">🎲 샘플 8명</button>
        <button type="button" class="mini-btn" id="clearBtn">🗑 지우기</button>
      </div>

      <button type="button" id="startBtn" class="primary-btn" disabled>이름을 2명 이상 입력하세요</button>
      <p class="hint">최대 40명 · 같은 이름은 (2), (3)으로 자동 구분됩니다</p>
    </div>
  </section>

  <!-- ② 추첨 화면 -->
  <section id="gameScreen" class="screen">
    <div class="topbar">
      <button type="button" id="quitBtn" class="top-btn" aria-label="그만두기">✕</button>
      <span class="top-chip">🔮 남은 구슬 <b id="remainChip">0</b></span>
      <button type="button" id="ffBtn" class="top-btn wide">⏩ ×1</button>
    </div>
    <div class="canvas-wrap">
      <canvas id="board"></canvas>
    </div>
    <div class="ticker-wrap">
      <span class="ticker-label">먼저 도착 = 탈락 ❌</span>
      <div id="ticker" class="ticker"></div>
    </div>
  </section>

  <!-- ③ 당첨 오버레이 -->
  <div id="winnerOverlay" class="overlay" hidden>
    <div class="overlay-card">
      <div class="trophy">🏆</div>
      <p class="overlay-sub">마지막까지 남은 구슬</p>
      <h2 id="winnerName">-</h2>
      <div class="overlay-btns">
        <button type="button" id="againBtn" class="primary-btn">🔁 다시 추첨</button>
        <button type="button" id="editBtn" class="ghost-btn">📝 명단 수정</button>
      </div>
    </div>
  </div>

  <canvas id="fx"></canvas>

  <script src="app.js"></script>
</body>
</html>
