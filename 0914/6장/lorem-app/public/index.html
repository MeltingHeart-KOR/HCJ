<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1a1625" />
  <title>✒️ Lorem Ipsum 생성기</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="header">
    <h1 class="title">✒️ Lorem Ipsum</h1>
    <p class="subtitle">슬라이더로 원하는 분량의 더미 텍스트를 만드세요</p>
  </header>

  <main class="container">

    <!-- 컨트롤 카드 -->
    <section class="card control-card">
      <div class="len-row">
        <span class="len-label">글자 수</span>
        <output id="lenValue" class="len-value" for="lenSlider">150</output>
      </div>

      <input
        type="range"
        id="lenSlider"
        min="10"
        max="5000"
        step="1"
        value="150"
        aria-label="생성할 글자 수"
      />

      <div class="range-scale">
        <span>10</span>
        <span>5,000</span>
      </div>

      <!-- 빠른 선택 프리셋 -->
      <div class="presets" id="presets">
        <button type="button" class="preset-btn" data-len="50">50</button>
        <button type="button" class="preset-btn active" data-len="150">150</button>
        <button type="button" class="preset-btn" data-len="500">500</button>
        <button type="button" class="preset-btn" data-len="1000">1,000</button>
        <button type="button" class="preset-btn" data-len="3000">3,000</button>
        <button type="button" class="preset-btn" data-len="5000">5,000</button>
      </div>
    </section>

    <!-- 결과 카드 -->
    <section class="card result-card">
      <div class="result-head">
        <div class="result-stats">
          <span id="statChars" class="stat-chip">150자</span>
          <span id="statWords" class="stat-chip sub">0 단어</span>
        </div>
        <div class="result-actions">
          <button type="button" id="regenBtn" class="icon-btn" title="새로 생성">🎲</button>
          <button type="button" id="copyBtn" class="icon-btn" title="복사">📋</button>
        </div>
      </div>

      <div id="loremText" class="lorem-text" aria-live="polite"></div>
    </section>

    <p class="footnote">Lorem Ipsum은 1500년대부터 쓰여온 인쇄·디자인용 더미 텍스트입니다.</p>
  </main>

  <!-- 토스트 -->
  <div id="toast" class="toast" role="status"></div>

  <script src="app.js"></script>
</body>
</html>
