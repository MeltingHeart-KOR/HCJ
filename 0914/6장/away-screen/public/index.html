<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>🚪 자리 비움 안내 화면</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- ════════ ① 설정 화면 ════════ -->
<main id="setupScreen" class="setup">
  <div class="setup-card">
    <h1 class="setup-title">🚪 자리 비움 안내</h1>
    <p class="setup-sub">화면에 표시할 정보를 입력하세요</p>

    <!-- 일정 -->
    <label class="field-label" for="inputSchedule">일정 <span class="req">*</span></label>
    <input id="inputSchedule" type="text" maxlength="30"
           placeholder="예: 점심 식사 중" autocomplete="off" />
    <div class="chips" id="scheduleChips">
      <button type="button" class="chip" data-value="회의 중">회의 중</button>
      <button type="button" class="chip" data-value="점심 식사 중">점심 식사 중</button>
      <button type="button" class="chip" data-value="외근 중">외근 중</button>
      <button type="button" class="chip" data-value="잠시 자리 비움">잠시 자리 비움</button>
      <button type="button" class="chip" data-value="휴식 중">휴식 중</button>
    </div>

    <!-- 돌아오는 시간 -->
    <label class="field-label" for="inputReturn">돌아오는 시간 <span class="req">*</span></label>
    <input id="inputReturn" type="time" />
    <div class="chips" id="timeChips">
      <button type="button" class="chip" data-min="10">+10분</button>
      <button type="button" class="chip" data-min="30">+30분</button>
      <button type="button" class="chip" data-min="60">+1시간</button>
      <button type="button" class="chip" data-min="120">+2시간</button>
    </div>

    <!-- 기타 문구 -->
    <label class="field-label" for="inputMessage">기타 안내 문구 <span class="opt">(선택)</span></label>
    <input id="inputMessage" type="text" maxlength="60"
           placeholder="예: 급한 용무는 내선 1234로 연락주세요" autocomplete="off" />

    <button id="btnConfirm" class="btn-confirm" disabled>확인 ✦ 화면 표시</button>
    <p class="setup-hint">표시 중에는 화면이 자동으로 꺼지지 않습니다</p>
  </div>
</main>

<!-- ════════ ② 안내 화면 (그라데이션) ════════ -->
<section id="displayScreen" class="display hidden">
  <!-- 움직이는 그라데이션 배경 레이어 -->
  <div class="gradient-bg" aria-hidden="true">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <div class="display-content">
    <p class="now-clock" id="nowClock">--:--</p>

    <!-- 일정: 가장 큰 글자 -->
    <h2 class="d-schedule" id="dSchedule">회의 중</h2>

    <!-- 돌아오는 시간 -->
    <p class="d-return" id="dReturn">🕒 <b>13:00</b>에 돌아옵니다</p>

    <!-- 카운트다운 -->
    <p class="d-countdown" id="dCountdown">00:00:00</p>
    <p class="d-countdown-label" id="dCountdownLabel">남은 시간</p>

    <!-- 기타 안내 문구 -->
    <p class="d-message" id="dMessage"></p>
  </div>

  <p class="exit-hint">화면을 <b>두 번 탭</b>하면 종료됩니다</p>
</section>

<script src="app.js"></script>
</body>
</html>
